<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Pipeline du coach : une question, une réponse sourcée</text>

  <!-- Étape 1 -->
  <rect x="20" y="60" width="170" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="85" text-anchor="middle" font-weight="bold" fill="#1e3a8a">1. Requête</text>
  <text x="105" y="107" text-anchor="middle" font-size="12" fill="#334155">FEN, camp, coups joués,</text>
  <text x="105" y="124" text-anchor="middle" font-size="12" fill="#334155">question de l'élève</text>

  <!-- Étape 2 -->
  <rect x="225" y="60" width="330" height="250" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="390" y="85" text-anchor="middle" font-weight="bold" fill="#14532d">2. Contexte calculé et numéroté (context.mjs)</text>
  <text x="240" y="112" font-size="12" fill="#334155">[E0-E2] rois, droits de roque, évaluation, matériel vs éval</text>
  <text x="240" y="132" font-size="12" fill="#334155">[L1-L3] 3 lignes Stockfish (notation française)</text>
  <text x="240" y="152" font-size="12" fill="#334155">[L1m] au bout de la ligne : matériel, rois</text>
  <text x="240" y="172" font-size="12" fill="#334155">[L1+n / L1-n] ce que la ligne fait apparaître / disparaître</text>
  <text x="240" y="192" font-size="12" fill="#334155">[L1tn] motifs exécutés (fourchette, coup intermédiaire…)</text>
  <text x="240" y="212" font-size="12" fill="#334155">[S…] structure de pions et plans classiques</text>
  <text x="240" y="232" font-size="12" fill="#334155">[M…] menace adverse ; [P…] ce qu'il prépare</text>
  <text x="240" y="252" font-size="12" fill="#334155">[K…] manœuvres ; [F…] bilan atouts / faiblesses</text>
  <text x="240" y="280" font-size="12" fill="#15803d">Chaque fait est daté : [Position actuelle],</text>
  <text x="240" y="297" font-size="12" fill="#15803d">[Après la ligne N…], [Pendant la ligne N]</text>

  <!-- Étape 3 -->
  <rect x="590" y="60" width="170" height="110" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="675" y="85" text-anchor="middle" font-weight="bold" fill="#581c87">3. LLM rédige</text>
  <text x="675" y="107" text-anchor="middle" font-size="12" fill="#334155">prompt.mjs : explique,</text>
  <text x="675" y="124" text-anchor="middle" font-size="12" fill="#334155">ne calcule pas, cite</text>
  <text x="675" y="141" text-anchor="middle" font-size="12" fill="#334155">chaque affirmation [F7]</text>
  <text x="675" y="158" text-anchor="middle" font-size="12" fill="#334155">(≤ 180 mots, 4 rubriques)</text>

  <!-- Étape 4 -->
  <rect x="790" y="60" width="150" height="150" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="865" y="85" text-anchor="middle" font-weight="bold" fill="#881337">4. Vérification</text>
  <text x="865" y="108" text-anchor="middle" font-size="12" fill="#334155">verify.mjs :</text>
  <text x="865" y="125" text-anchor="middle" font-size="12" fill="#334155">citation existe ?</text>
  <text x="865" y="142" text-anchor="middle" font-size="12" fill="#334155">cases et notions</text>
  <text x="865" y="159" text-anchor="middle" font-size="12" fill="#334155">dans la source ?</text>
  <text x="865" y="176" text-anchor="middle" font-size="12" fill="#334155">guard.mjs : coup</text>
  <text x="865" y="193" text-anchor="middle" font-size="12" fill="#334155">légal ou fourni ?</text>

  <!-- Réécriture -->
  <rect x="590" y="235" width="350" height="75" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="765" y="258" text-anchor="middle" font-weight="bold" fill="#713f12">5. Problèmes ? → une réécriture</text>
  <text x="765" y="279" text-anchor="middle" font-size="12" fill="#334155">le LLM reçoit la liste précise des affirmations mal sourcées</text>
  <text x="765" y="296" text-anchor="middle" font-size="12" fill="#334155">et corrige ; on garde la version avec le moins de problèmes</text>

  <!-- Sortie -->
  <rect x="590" y="340" width="350" height="95" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="765" y="364" text-anchor="middle" font-weight="bold" fill="#1e3a8a">6. Affichage</text>
  <text x="765" y="386" text-anchor="middle" font-size="12" fill="#334155">citations retirées ; statut « ✓ sources vérifiées »</text>
  <text x="765" y="404" text-anchor="middle" font-size="12" fill="#334155">ou « ⚠ N affirmations non vérifiées » (détail au survol)</text>
  <text x="765" y="422" text-anchor="middle" font-size="12" fill="#334155">Évaluation / L'idée / Coup conseillé / Attention</text>

  <!-- Relecteur -->
  <rect x="225" y="340" width="330" height="95" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="390" y="364" text-anchor="middle" font-weight="bold" fill="#0f172a">Relecteur de justesse (optionnel)</text>
  <text x="390" y="386" text-anchor="middle" font-size="12" fill="#334155">judge.mjs : un autre LLM juge le FOND (contresens,</text>
  <text x="390" y="404" text-anchor="middle" font-size="12" fill="#334155">gain promis à tort, principe violé) → note /10</text>
  <text x="390" y="422" text-anchor="middle" font-size="12" fill="#334155">utilisé par le banc d'essai (coach-eval --judge)</text>

  <!-- Flèches -->
  <line x1="190" y1="105" x2="223" y2="105" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="555" y1="115" x2="588" y2="115" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="760" y1="115" x2="788" y2="115" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="865" y1="210" x2="865" y2="233" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="765" y1="310" x2="765" y2="338" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="590" y1="388" x2="557" y2="388" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <path d="M 700 235 Q 690 200 675 172" fill="none" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="20" y="480" font-size="13" font-weight="bold" fill="#0f172a">Mesuré sur 16 positions de référence (relecteur DeepSeek-Pro) :</text>
  <text x="20" y="502" font-size="12" fill="#334155">naïf (FEN seule, ancien projet) : justesse 4,9-5,1 / 10, 24-26 erreurs graves, ~50 coups inventés</text>
  <text x="20" y="522" font-size="12" fill="#334155">ancré (ce pipeline) : justesse 8,2 (Flash) à 8,8 (Pro) / 10, 2 à 8 erreurs graves, 0 coup inventé</text>
</svg>
