<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-label="Le modèle"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6457"/></marker></defs><rect width="100%" height="100%" fill="#faf8f2"/><text x="470" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d18">L’encodeur d’arbres : entrées, architecture, sorties</text>
<rect x="30" y="70" width="28" height="28" rx="4" fill="#ffffff" stroke="#1f1d18"/>
<rect x="64" y="70" width="28" height="28" rx="4" fill="#333028" stroke="#1f1d18"/>
