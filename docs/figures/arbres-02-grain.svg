<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" role="img" aria-label="Anatomie d’un grain"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6457"/></marker></defs><rect width="100%" height="100%" fill="#faf8f2"/><text x="470" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d18">Un grain = un demi-coup, décrit par ce que le code voit</text>
<rect x="20" y="60" width="210" height="110" rx="10" fill="#efe9da" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="125.0" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Identité</text>
<text x="125.0" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">camp · pièce · prise · échec · roque</text>
