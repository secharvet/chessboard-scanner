<text x="30" y="70" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#6b6457">demi-coups de la partie (blanc, noir, blanc, noir…)</text>
<rect x="232" y="130" width="416" height="34" rx="6" fill="#e3eef7" stroke="#2b5d8a"/>
<text x="446" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2b5d8a">FENÊTRE : 16 demi-coups, vus du camp qui vient de jouer (« moi »)</text>
<rect x="648" y="130" width="260" height="34" rx="6" fill="#e6f1e8" stroke="#2f6f4f"/>
<text x="784" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2f6f4f">AVENIR : 10 demi-coups</text>
<text x="470" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#6b6457">La fenêtre glisse de deux demi-coups en deux demi-coups, à partir du 10e coup. Une partie de 80 demi-coups donne environ 25 fenêtres.</text>
<text x="470" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#6b6457">L’avenir n’est pas « quels coups » mais « quels faits » : pression sur son roi qui monte, colonne qui s’ouvre, pion passé, défenseur disparu, matériel gagné, levier, roque…</text>
<text x="470" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#1f1d18">Le modèle doit prédire l’avenir depuis la fenêtre. Deux fenêtres faites de coups différents qui mènent au même avenir reçoivent le même vecteur :</text>
<text x="470" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#6b4f1d">c’est la définition opérationnelle de l’intention.</text></svg>