<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" role="img" aria-label="La chaîne complète"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6457"/></marker></defs><rect width="100%" height="100%" fill="#faf8f2"/><rect x="20" y="30" width="200" height="100" rx="10" fill="#efe9da" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="120.0" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Parties humaines</text>
<text x="120.0" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">1,65 M parties Lichess Elite</text>
<text x="120.0" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">2400+ contre 2200+, sans moteur</text>
<line x1="220" y1="80" x2="250" y2="80" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="250" y="30" width="200" height="100" rx="10" fill="#efe9da" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="350.0" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Grains</text>
<text x="350.0" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">le code voit : effets, atomes,</text>
<text x="350.0" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">faits, contrôle, cibles, plans</text>
<line x1="450" y1="80" x2="480" y2="80" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="480" y="30" width="200" height="100" rx="10" fill="#e3eef7" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="580.0" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Fenêtres bicolores</text>
<text x="580.0" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">16 demi-coups, traits relationnels,</text>
<text x="580.0" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">+ l’avenir des 10 suivants</text>
<line x1="680" y1="80" x2="710" y2="80" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="710" y="30" width="200" height="100" rx="10" fill="#e3eef7" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="810.0" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Encodeur appris</text>
<text x="810.0" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">transformeur, 4 couches,</text>
<text x="810.0" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">vecteur de 128 nombres</text>
<path d="M810,130 C810,165 120,165 120,200" fill="none" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="200" width="200" height="100" rx="10" fill="#e6f1e8" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="120.0" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Base vectorielle</text>
<text x="120.0" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">FAISS : 2 M de vecteurs,</text>
<text x="120.0" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">voisins en millisecondes</text>
<line x1="220" y1="250" x2="250" y2="250" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="250" y="200" width="200" height="100" rx="10" fill="#e6f1e8" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="350.0" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Arbres remarquables</text>
<text x="350.0" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">k-moyennes, soutien,</text>
<text x="350.0" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">compacité, prévisibilité</text>
<line x1="450" y1="250" x2="480" y2="250" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="480" y="200" width="200" height="100" rx="10" fill="#f6e5e5" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="580.0" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Nommage</text>
<text x="580.0" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">parties annotées, LLM vérifié,</text>
<text x="580.0" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">lecture à l’aveugle</text>
<line x1="680" y1="250" x2="710" y2="250" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="710" y="200" width="200" height="100" rx="10" fill="#f6e5e5" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="810.0" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Coach</text>
<text x="810.0" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">position → vecteur → arbres</text>
<text x="810.0" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">proches → récit, moteur en garde-fou</text>
<text x="470" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#6b4f1d">Aucune règle écrite entre les grains et les arbres : l’enchaînement est appris, compté, puis nommé.</text></svg>