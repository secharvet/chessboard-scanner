<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, sans-serif" font-size="12">
  <rect width="900" height="420" fill="#fbf8f1"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b6257"/></marker></defs>
  <g font-size="11" fill="#2b2620">
    <!-- openings -->
    <rect x="30" y="40" width="170" height="78" rx="6" fill="#fff" stroke="#c08a4a" stroke-width="1.5"/>
    <text x="40" y="58" font-weight="700">openings</text>
    <text x="40" y="76">id (francaise, italienne)</text><text x="40" y="90">nom, signature, ordre</text>
    <!-- positions -->
    <rect x="260" y="40" width="190" height="92" rx="6" fill="#fff" stroke="#c08a4a" stroke-width="1.5"/>
    <text x="270" y="58" font-weight="700">positions</text>
    <text x="270" y="76">opening_id, fen_key (unique)</text><text x="270" y="90">coups, ply, parent_id</text>
    <text x="270" y="118" fill="#6b6257" font-style="italic">l'arbre, partagé par tous</text>
    <!-- moves -->
    <rect x="520" y="40" width="200" height="106" rx="6" fill="#fff" stroke="#c08a4a" stroke-width="1.5"/>
    <text x="530" y="58" font-weight="700">moves (coups proposés)</text>
    <text x="530" y="76">position_id, san, ord</text><text x="530" y="90">kind : principal | variante | faute | porte</text>
    <text x="530" y="104">to_position_id, porte_opening_id</text><text x="530" y="118">created_by</text>
    <!-- users -->
    <rect x="30" y="220" width="170" height="78" rx="6" fill="#fff" stroke="#3f6f8f" stroke-width="1.5"/>
    <text x="40" y="238" font-weight="700">users</text>
    <text x="40" y="256">email, password_hash</text><text x="40" y="270">display_name, club</text><text x="40" y="284">role : apprenant | enseignant | admin</text>
    <!-- explanations -->
    <rect x="260" y="200" width="300" height="150" rx="6" fill="#fff" stroke="#3f6f8f" stroke-width="2"/>
    <text x="270" y="218" font-weight="700">explanations (une ligne par version)</text>
    <text x="270" y="238">position_id, author_id, version</text>
    <text x="270" y="252">status : brouillon | publie | archive</text>
    <text x="270" y="266">based_on_id (version dont on est parti)</text>
    <text x="270" y="286" font-weight="600">content (JSON) :</text>
    <text x="280" y="300">nom, sens, menace, schema,</text>
    <text x="280" y="314">annotations [cases, flèches],</text>
    <text x="280" y="328">coups [{move_id, pourquoi, annotations, sequence{pas[]}}]</text>
    <text x="270" y="344" fill="#6b6257" font-style="italic">une seule version « publie » par (position, auteur)</text>
    <!-- remarks -->
    <rect x="620" y="220" width="200" height="64" rx="6" fill="#fff" stroke="#3f6f8f" stroke-width="1.5"/>
    <text x="630" y="238" font-weight="700">remarks</text>
    <text x="630" y="256">explanation_id, author_id</text><text x="630" y="270">texte, created_at</text>
    <!-- reference -->
    <rect x="620" y="310" width="200" height="56" rx="6" fill="#fff" stroke="#3f6f8f" stroke-width="1.5"/>
    <text x="630" y="328" font-weight="700">reference (repli)</text>
    <text x="630" y="346">opening_id, position_id?, author_id</text>
    <!-- liens -->
    <g stroke="#6b6257" stroke-width="1.2" fill="none" marker-end="url(#m)">
      <line x1="200" y1="79" x2="258" y2="79"/>
      <line x1="450" y1="79" x2="518" y2="79"/>
      <path d="M620,146 C620,180 420,170 420,198"/>
      <line x1="200" y1="259" x2="258" y2="259"/>
      <line x1="560" y1="250" x2="618" y2="250"/>
      <path d="M410,132 L410,198"/>
      <path d="M560,330 L618,336"/>
    </g>
    <text x="205" y="72" font-size="9" fill="#6b6257">1..n</text><text x="455" y="72" font-size="9" fill="#6b6257">1..n</text>
    <text x="205" y="252" font-size="9" fill="#6b6257">auteur</text><text x="565" y="243" font-size="9" fill="#6b6257">sur une version</text>
    <text x="415" y="170" font-size="9" fill="#6b6257">position</text>
    <text x="440" y="190" font-size="9" fill="#6b6257">content.coups[].move_id</text>
  </g>
  <text x="30" y="400" fill="#6b6257" font-size="10">Ocre : l'arbre partagé (relationnel). Bleu : les textes signés et versionnés (une ligne par version, contenu en JSON).</text>
</svg>
