<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" role="img" aria-label="Usage par le coach"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6457"/></marker></defs><rect width="100%" height="100%" fill="#faf8f2"/><text x="470" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d18">Ce que le coach en fait : retrouver, jamais inventer</text>
<rect x="30" y="80" width="170" height="90" rx="10" fill="#efe9da" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="115.0" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Partie en cours</text>
<text x="115.0" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">les 16 derniers</text>
<text x="115.0" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">demi-coups</text>
<line x1="200" y1="125" x2="240" y2="125" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="240" y="80" width="170" height="90" rx="10" fill="#e3eef7" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="325.0" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Grains + encodeur</text>
<text x="325.0" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">le même code,</text>
<text x="325.0" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">le même modèle</text>
<line x1="410" y1="125" x2="450" y2="125" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="450" y="80" width="170" height="90" rx="10" fill="#e6f1e8" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="535.0" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Base vectorielle</text>
<text x="535.0" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">voisins les plus proches</text>
<text x="535.0" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">pour moi et pour lui</text>
<line x1="620" y1="125" x2="660" y2="125" stroke="#6b6457" stroke-width="2" marker-end="url(#ar)"/>
<rect x="660" y="80" width="250" height="90" rx="10" fill="#f6e5e5" stroke="#c9c2b2" stroke-width="1.5"/>
<text x="785.0" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Récit</text>
<text x="785.0" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">« tes trois derniers coups suivent</text>
<text x="785.0" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">l’arbre X (1 240 parties), qui continue</text>
<text x="785.0" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">d’habitude par … ; lui est dans Y »</text>
<rect x="240" y="210" width="380" height="80" rx="10" fill="#fff" stroke="#6b4f1d" stroke-width="1.5"/>
<text x="430.0" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f1d18">Garde-fou moteur</text>
<text x="430.0" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">la suite proposée par l’arbre est dite si elle est dans</text>
<text x="430.0" y="273" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b6457">les trois premiers coups de Stockfish ; sinon le coach dit l’arbre, pas le coup</text>
<line x1="535" y1="170" x2="480" y2="210" stroke="#6b4f1d" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 5"/>
<text x="470" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#1f1d18">Un écart du joueur ne casse rien : c’est la proximité qui compte, pas une correspondance exacte.</text></svg>