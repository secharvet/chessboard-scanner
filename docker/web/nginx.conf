types {
    application/wasm wasm;
    application/javascript js;
    text/javascript mjs;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Derrière Caddy (HTTPS) : l'adresse réelle du visiteur arrive dans X-Real-IP.
    # Sûr parce que le port du site n'est joignable que localement (pare-feu), donc
    # seul Caddy peut poser cet en-tête.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Real-IP;
    index index.html;

    # Sources montées en entier en dev : ne jamais servir secrets ni code serveur.
    location ~ /\. { deny all; return 404; }
    location ~ ^/(coach|node_modules|reports|logs|memory|collector|scripts|tests|docker|archive|data)/ { deny all; return 404; }
    location ~ \.(md|mjs|json|jsonl|yaml|yml|sh|py|lock)$ { deny all; return 404; }
    location = /Makefile { deny all; return 404; }

    location ^~ /vendor/ {
        alias /opt/vendor/;
    }

    location ^~ /pgn/ {
        alias /data/pgn/;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location /health {
        return 200 "OK";
    }

    location /llm-factory-health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://host.containers.internal:8000/health;
    }

    location /api/chess/mentor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_pass http://host.containers.internal:8000/api/chess/mentor/;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
