types {
    application/wasm wasm;
    application/javascript js;
    text/javascript mjs;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Derrière Caddy (HTTPS) : l'adresse réelle du visiteur arrive dans X-Real-IP.
    # Sûr parce que le port du site n'est joignable que localement (pare-feu), donc
    # seul Caddy peut poser cet en-tête.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Real-IP;
    index index.html;
    absolute_redirect off;
    error_page 404 /404.html;   # derrière Caddy (HTTPS) : redirections relatives, jamais http://

    # Sources montées en entier en dev : ne jamais servir secrets ni code serveur.
    location ~ /\. { deny all; return 404; }
    location ~ ^/(coach|node_modules|reports|logs|memory|collector|scripts|tests|docker|archive|data|db)/ { deny all; return 404; }
    location ~ \.(md|mjs|json|jsonl|yaml|yml|sh|py|lock)$ { deny all; return 404; }
    location = /Makefile { deny all; return 404; }

    location ^~ /vendor/ {
        alias /opt/vendor/;
    }

    location ^~ /pgn/ {
        alias /data/pgn/;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # Les parties du coach joueur (fichiers d'exécution écrits par l'arène, lus par partie.html) : seule exception au refus des .json.
    location ^~ /parties/ {
        try_files $uri =404;
        types { application/json json; application/x-chess-pgn pgn; }
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location /health {
        return 200 "OK";
    }

    location /llm-factory-health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://host.containers.internal:8000/health;
    }

    location /api/chess/mentor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_pass http://host.containers.internal:8000/api/chess/mentor/;
    }

    # La partie en direct du coach joueur (jouer.html) : flux d'événements (SSE), sans tampon, connexion longue
    location = /api/joueur/en-cours/flux {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        proxy_pass http://host.containers.internal:8000/api/joueur/en-cours/flux;
    }

    # Plateforme d'apprentissage : comptes, livres, positions, explications (coach/plateforme.mjs)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_pass http://host.containers.internal:8000/api/;
    }

    # Vérification de session pour les pages réservées (auth_request) : l'API répond 200 ou 401.
    location = /_session_enseignant { internal; proxy_pass http://host.containers.internal:8000/api/auth/verifier?role=enseignant; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Cookie $http_cookie; }
    location = /_session_validateur { internal; proxy_pass http://host.containers.internal:8000/api/auth/verifier?role=validateur; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Cookie $http_cookie; }

    location = /editeur.html { auth_request /_session_enseignant; error_page 401 = @connexion; try_files $uri =404; add_header Cache-Control "no-cache, must-revalidate"; }
    location = /admin.html   { auth_request /_session_validateur; error_page 401 = @connexion; try_files $uri =404; add_header Cache-Control "no-cache, must-revalidate"; }
    location @connexion { return 302 /connexion.html?suite=$request_uri; }

    # Une page .html inconnue renvoie la vraie 404 (le repli sur index.html ne vaut que pour les autres chemins)
    location ~ \.html$ { try_files $uri =404; add_header Cache-Control "no-cache, must-revalidate"; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
