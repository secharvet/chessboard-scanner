# Override dev : tout le dépôt est monté sur la racine web → édition = F5, sans rebuild ni restart.
# Le vendor (chess.js, Stockfish WASM) vient de l'image (/opt/vendor) ; nginx.conf bloque
# .env, coach/, node_modules/ etc. Rebuild seulement si docker/web/ change.
#
#   ./scripts/dev.sh
#   make dev

services:
  web:
    volumes:
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./data/pgn:/data/pgn:ro,Z
      - .:/usr/share/nginx/html:ro,Z
